<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoRom</title>
<meta name="description" content="EcoRom">
<style>
  :root {
    --bg: #f4f7f2;
    --ink: #17301f;
    --muted: #5d7364;
    --accent: #2f8f4e;
    --card: #ffffff;
    --line: #dbe5dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a13;
      --ink: #e6f1e8;
      --muted: #93aa9a;
      --accent: #5ccf82;
      --card: #16241b;
      --line: #25382b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  main {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 48px 32px;
    text-align: center;
  }
  .mark {
    width: 64px; height: 64px;
    margin: 0 auto 20px;
    color: var(--accent);
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(2rem, 8vw, 2.75rem);
    letter-spacing: -0.02em;
  }
  h1 span { color: var(--accent); }
  p { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M52 12C28 12 12 26 12 42c0 5 2 8 4 10 4 3 9 2 13-1 9-7 8-19 23-39Z"/>
    <path d="M16 52c6-12 15-20 28-28"/>
  </svg>
  <h1>Eco<span>Rom</span></h1>
  <p>Сайт скоро будет готов.</p>
</main>
</body>
</html>
