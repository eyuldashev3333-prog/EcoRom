name: Daily backup to Telegram
# Рассылка бэкапа — ТОЛЬКО по запуску из ежедневного отчёта в 23:00 Ташкент (supabase/functions/daily-report → workflow_dispatch).
# Своё расписание GitHub (приходит с задержкой в часы) только читает базу без рассылки — держит бесплатную базу «живой».
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
      - run: node backup.mjs ${{ github.event_name == 'schedule' && '--no-send' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BACKUP_CHAT_IDS: ${{ secrets.BACKUP_CHAT_IDS }}
